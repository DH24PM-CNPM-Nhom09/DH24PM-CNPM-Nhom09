services:
  mariadb:
    image: mariadb:11
    container_name: ptpm_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password_doi_lai
      MARIADB_DATABASE: admission_db
      MARIADB_USER: admission_user
      MARIADB_PASSWORD: admission_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ptpm_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "mysql://admission_user:admission_pass@mariadb:3306/admission_db"
      JWT_SECRET: "doi-chuoi-nay-truoc-khi-deploy-toi-thieu-32-ky-tu"
      JWT_EXPIRES_IN: "8h"
      GOOGLE_CLIENT_ID: ""
      CORS_ORIGINS: "http://localhost:3000"
      DEV_AUTH_BYPASS: "true"
      AUTO_JOB_MINUTES: 15
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  uploads_data:
