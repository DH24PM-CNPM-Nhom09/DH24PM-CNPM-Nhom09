services:
  mariadb:
    image: mariadb:11
    container_name: ptpm_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password_doi_lai
      MARIADB_DATABASE: admission_db
      MARIADB_USER: admission_user
      MARIADB_PASSWORD: admission_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

